# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [ main, "vinicius/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          sw_vers
          swift --version
          clang++ --version
          python3 --version

      - name: Run full verification suite
        run: ./scripts/ci_check.sh
