# SPDX-License-Identifier: MPL-2.0
name: Release

on:
  push:
    branches: [ main ]
    paths:
      - "VERSION"
      - "Package.swift"
      - "Sources/**"
      - "Resources/**"
      - "design-system/tokens/**"
      - "design-system/generated/**"
      - "design-system/scripts/**"
      - "scripts/build_app.sh"
      - "scripts/build_dmg.sh"
      - "scripts/package_public_release.sh"
      - "scripts/generate_icns.py"
      - "scripts/check_deployment_target.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      summary:
        description: "Optional short release summary embedded in update-manifest.json"
        required: false
        default: ""
      staging:
        description: "Keep the installer as a GitHub Actions validation artifact without publishing to Releases"
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version and monotonic build number
        id: meta
        env:
          INPUT_SUMMARY: ${{ inputs.summary }}
        run: |
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          APP_BUILD="$(git rev-list --count HEAD)"
          APP_COMMIT="$(git rev-parse --short=7 HEAD)"
          RELEASE_TAG="v${APP_VERSION}-b${APP_BUILD}"
          PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          SUMMARY="${INPUT_SUMMARY:-}"
          if [ -z "$SUMMARY" ]; then
            SUMMARY="$(git log -1 --pretty=%s)"
          fi
          # Keep single-line and bounded for compact in-app banners.
          SUMMARY="$(printf '%s' "$SUMMARY" | tr '\r\n' '  ' | cut -c1-140)"

          {
            echo "TIMBR_VERSION=${APP_VERSION}"
            echo "TIMBR_BUILD_NUMBER=${APP_BUILD}"
            echo "TIMBR_COMMIT_SHA=${APP_COMMIT}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "PUBLISHED_AT=${PUBLISHED_AT}"
          } >> "$GITHUB_ENV"

          python3 - "$SUMMARY" <<'PY'
          import os, sys
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RELEASE_SUMMARY={sys.argv[1]}\n")
          PY

          echo "Release target: ${RELEASE_TAG} (version=${APP_VERSION}, build=${APP_BUILD}, commit=${APP_COMMIT})"

      - name: Run full CI verification suite
        run: ./scripts/ci_check.sh

      - name: Select distribution mode
        id: distribution
        env:
          SIGNED_BUILDS: ${{ vars.TIMBR_SIGNED_BUILDS }}
          PUBLIC_RELEASES: ${{ vars.TIMBR_PUBLIC_RELEASES }}
          STAGING: ${{ inputs.staging }}
        run: |
          if [[ "$PUBLIC_RELEASES" == true && "$SIGNED_BUILDS" != true ]]; then
            echo '::error::Public releases require Developer ID signing and Apple notarization.'
            exit 1
          fi
          signed=false
          public=false
          beta=false
          publish=false
          if [[ "$SIGNED_BUILDS" == true ]]; then signed=true; fi
          if [[ "$PUBLIC_RELEASES" == true && "$STAGING" != true ]]; then public=true; fi
          if [[ "$signed" != true && "$STAGING" != true ]]; then beta=true; fi
          if [[ "$public" == true || "$beta" == true ]]; then publish=true; fi
          printf 'signed=%s\npublic=%s\nbeta=%s\npublish=%s\n' "$signed" "$public" "$beta" "$publish" >> "$GITHUB_OUTPUT"

      - name: Package and notarize Developer ID DMG
        if: steps.distribution.outputs.signed == 'true'
        env:
          TIMBR_APPLE_TEAM_ID: ${{ vars.TIMBR_APPLE_TEAM_ID }}
          TIMBR_DEVELOPER_ID_P12: ${{ secrets.TIMBR_DEVELOPER_ID_P12 }}
          TIMBR_DEVELOPER_ID_PASSWORD: ${{ secrets.TIMBR_DEVELOPER_ID_PASSWORD }}
          TIMBR_NOTARY_KEY: ${{ secrets.TIMBR_NOTARY_KEY }}
          TIMBR_NOTARY_KEY_ID: ${{ secrets.TIMBR_NOTARY_KEY_ID }}
          TIMBR_NOTARY_ISSUER: ${{ secrets.TIMBR_NOTARY_ISSUER }}
        run: ./scripts/package_public_release.sh

      - name: Package development DMG
        if: steps.distribution.outputs.signed != 'true'
        run: ./scripts/build_dmg.sh

      - name: Store validation installer
        if: steps.distribution.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timbr-${{ env.RELEASE_TAG }}-validation
          path: dist/Timbr.dmg
          if-no-files-found: error

      - name: Generate SHA-256 and update-manifest.json
        if: steps.distribution.outputs.publish == 'true'
        env:
          DISTRIBUTION_CHANNEL: ${{ steps.distribution.outputs.public == 'true' && 'developer-id-notarized' || 'ad-hoc-beta' }}
        run: |
          DMG_SHA256="$(shasum -a 256 dist/Timbr.dmg | awk '{print $1}')"
          echo "DMG_SHA256=${DMG_SHA256}" >> "$GITHUB_ENV"
          printf '%s  Timbr.dmg\n' "$DMG_SHA256" > dist/Timbr.dmg.sha256

          DMG_SHA256="$DMG_SHA256" python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["TIMBR_VERSION"]
          build = int(os.environ["TIMBR_BUILD_NUMBER"])
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["TIMBR_COMMIT_SHA"]
          published_at = os.environ["PUBLISHED_AT"]
          sha256 = os.environ["DMG_SHA256"].lower()
          summary = os.environ.get("RELEASE_SUMMARY", "").strip()
          distribution = os.environ["DISTRIBUTION_CHANNEL"]

          assert re.fullmatch(r"[0-9a-f]{64}", sha256), f"Invalid SHA-256: {sha256}"

          manifest = {
              "schemaVersion": 1,
              "distribution": distribution,
              "version": version,
              "build": build,
              "tag": tag,
              "commit": commit,
              "publishedAt": published_at,
              "minimumMacOS": "15.0",
              "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/Timbr.dmg",
              "releaseNotesURL": f"https://github.com/{repo}/releases/tag/{tag}",
              "sha256": sha256,
              "summary": summary or None,
          }

          out = Path("dist/update-manifest.json")
          out.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Generate release notes
        if: steps.distribution.outputs.publish == 'true'
        env:
          IS_PUBLIC: ${{ steps.distribution.outputs.public }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*-b*' HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGES="$(git log --pretty='- %s (%h)' "${PREV_TAG}..HEAD" | head -n 25)"
          else
            CHANGES="$(git log --pretty='- %s (%h)' -n 10)"
          fi

          CHANGES="$CHANGES" python3 - <<'PY'
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          ver = os.environ["TIMBR_VERSION"]
          build = os.environ["TIMBR_BUILD_NUMBER"]
          commit = os.environ["TIMBR_COMMIT_SHA"]
          sha = os.environ["DMG_SHA256"]
          tag = os.environ["RELEASE_TAG"]
          changes = os.environ["CHANGES"]
          is_public = os.environ.get("IS_PUBLIC") == "true"

          if is_public:
              notes = f"""## timbr {ver} (build {build})

          Official build published automatically from `main` commit `{commit}`.

          ### Changes
          {changes}

          ### Verification
          - **Minimum macOS:** 15.0 (Sequoia) or newer
          - **DMG SHA-256:** `{sha}`
          - **Automatic updates:** Installed copies of `timbr` read `update-manifest.json` over HTTPS (zero cookies, zero telemetry) and verify SHA-256 + `codesign` before applying updates.
          - **Signing status:** Developer ID Application, Hardened Runtime and Apple notarization. Open the DMG and drag timbr into Applications.
          """
          else:
              notes = f"""## timbr {ver} (beta build {build})

          Pre-release beta build published automatically from `main` commit `{commit}`.

          ### Changes
          {changes}

          ### Verification
          - **Minimum macOS:** 15.0 (Sequoia) or newer
          - **DMG SHA-256:** `{sha}`
          - **Signing status:** Ad-hoc development build (**not** signed with Apple Developer ID and **not** notarized yet).
          - **First open / updates:** Drag **Timbr.app** into **Applications**. If macOS blocks the first launch, use **System Settings → Privacy & Security → Open Anyway** ([installation guide](https://github.com/{repo}/blob/main/docs/instalacao.md)). Because ad-hoc signatures change per build, in-app updates verify SHA-256 + `codesign` and save the verified DMG for manual replacement in Applications.
          """
              Path("dist/beta-channel-notes.md").write_text(
                  f"Rolling manifest pointer for automatic **timbr** beta pre-releases.\n\n"
                  f"Latest beta build: **{tag}** (`https://github.com/{repo}/releases/tag/{tag}`).\n",
                  encoding="utf-8",
              )

          lines = [line[10:] if line.startswith("          ") else line for line in notes.splitlines()]
          Path("dist/release-notes.md").write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Publish official GitHub Release
        if: steps.distribution.outputs.public == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release download "${RELEASE_TAG}" --pattern update-manifest.json --output "$RUNNER_TEMP/published-manifest.json" --clobber
            python3 - "$RUNNER_TEMP/published-manifest.json" <<'PYTHON'
          import json, os, re, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["commit"] == os.environ["TIMBR_COMMIT_SHA"]
          assert manifest["distribution"] == "developer-id-notarized"
          checksum = manifest["sha256"]
          assert re.fullmatch(r"[0-9a-f]{64}", checksum)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DMG_SHA256={checksum}\n")
          PYTHON
          else
            gh release create "${RELEASE_TAG}" \
              dist/Timbr.dmg \
              dist/Timbr.dmg.sha256 \
              dist/update-manifest.json \
              --target "${GITHUB_SHA}" \
              --title "timbr ${TIMBR_VERSION} (build ${TIMBR_BUILD_NUMBER})" \
              --notes-file dist/release-notes.md \
              --latest
          fi

      - name: Publish beta pre-release and update beta channel manifest
        if: steps.distribution.outputs.beta == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              dist/Timbr.dmg \
              dist/Timbr.dmg.sha256 \
              dist/update-manifest.json \
              --target "${GITHUB_SHA}" \
              --title "timbr ${TIMBR_VERSION} (beta build ${TIMBR_BUILD_NUMBER})" \
              --notes-file dist/release-notes.md \
              --prerelease
          fi

          git push origin "${GITHUB_SHA}:refs/tags/beta" --force
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta \
              --prerelease \
              --title "timbr ${TIMBR_VERSION} (beta channel)" \
              --notes-file dist/beta-channel-notes.md
            gh release upload beta dist/update-manifest.json --clobber
          else
            gh release create beta \
              dist/update-manifest.json \
              --target "${GITHUB_SHA}" \
              --title "timbr ${TIMBR_VERSION} (beta channel)" \
              --notes-file dist/beta-channel-notes.md \
              --prerelease
          fi

      - name: Verify live update-manifest.json on GitHub Releases CDN
        if: steps.distribution.outputs.publish == 'true'
        env:
          IS_PUBLIC: ${{ steps.distribution.outputs.public }}
        run: |
          if [[ "$IS_PUBLIC" == 'true' ]]; then
            URLS=("https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update-manifest.json")
          else
            URLS=(
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/update-manifest.json"
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/update-manifest.json"
            )
          fi
          for URL in "${URLS[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$URL" -o /tmp/live-manifest.json; then
                python3 -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); assert d["tag"] == sys.argv[2] and d["sha256"] == sys.argv[3], d; print("[PASS] Live manifest verified:", sys.argv[4], d["tag"], d["sha256"][:12])' /tmp/live-manifest.json "$RELEASE_TAG" "$DMG_SHA256" "$URL"
                ok=1
                break
              fi
              echo "Waiting for CDN propagation ($URL, attempt $attempt)..."
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then
              echo "ERROR: Could not verify live update-manifest.json at $URL"
              exit 1
            fi
          done
